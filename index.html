<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — puzzle de lumière</title>
<meta name="description" content="Lumen : guide un rayon de lumière avec des miroirs et allume toutes les cibles. Un puzzle calme, un défi par jour.">
<style>
  :root { --bg: #fbfaf7; --fg: #23212b; --mut: #6a6676; --acc: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0d18; --fg: #ece9f4; --mut: #a6a1b6; --acc: #ffd36b; } }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 38rem; padding: 4rem 1.25rem; color: var(--fg); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  h1 { font-size: 2.6rem; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--acc); margin: .2rem 0 2rem; }
  p { color: var(--mut); }
  a { color: var(--acc); }
  footer { margin-top: 3rem; font-size: .9rem; }
</style>
</head>
<body>
<h1>Lumen</h1>
<p class="sub">Puzzle de lumière et miroirs</p>
<p>Guide un rayon à travers de petits dioramas : pose des miroirs et des séparateurs, mélange les couleurs, allume toutes les cibles. Un défi nouveau chaque jour, et une course contre l'ombre.</p>
<p>Bientôt sur Google Play et l'App Store.</p>
<footer><a href="privacy/">Politique de confidentialité</a></footer>
</body>
</html>
